[package]
name = "ssse"
version = "0.1.0"
edition = "2021"

[lib]
name = "ssse"
path = "src/lib.rs"

[[bin]]
name = "ssse"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["rustls-tls", "gzip", "deflate"] }
scraper = "0.20"
url = "2"
psl = "2"
argon2 = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"